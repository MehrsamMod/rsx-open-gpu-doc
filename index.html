      display: flex;
      align-items: center;
      justify-content: space-between;

      height: 40px;          /* adjust size as needed */
      width: auto;
      display: block;

      align-items: center;
    }

    .github-link svg {
      width: 28px;
      height: 28px;
      transition: opacity 0.2s;
    }

    .github-link:hover svg {
      opacity: 0.7;
    }
